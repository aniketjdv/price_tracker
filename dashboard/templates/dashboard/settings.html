{% extends 'dashboard/base.html' %}
{% block title %}Settings - Price Tracker{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex align-items-start justify-content-between gap-3 mb-4 flex-column flex-md-row">
    <div>
      <h2 class="fw-bold">Settings</h2>
      <p class="text-muted">Manage your account preferences.</p>
    </div>
    <button class="btn btn-outline-danger">Delete Account</button>
  </div>

  <div class="row g-4">
    <div class="col-12 col-xl-6">
      <div class="card rounded-4 shadow-sm border-0 p-4">
        <h5 class="fw-semibold mb-3">Profile Information</h5>
        <form>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" value="Priya Sharma" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="priya.sharma@gmail.com" />
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" value="+91 98765 43210" />
          </div>
          <button class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
    <div class="col-12 col-xl-6">
      <div class="card rounded-4 shadow-sm border-0 p-4">
        <h5 class="fw-semibold mb-3">Preferences</h5>
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="darkModeSwitch">
          <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>
        </div>
        <p class="text-muted small">Switch to dark theme for lower light mode eyestrain.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
