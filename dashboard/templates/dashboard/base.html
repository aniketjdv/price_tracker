{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Price Tracker Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{% static 'dashboard/css/dashboard.css' %}" />
  </head>
  <body class="bg-light">
    <div class="d-flex min-vh-100">
      <nav class="sidebar bg-white border-end">
        <div class="sidebar-brand px-4 py-4 d-flex align-items-center gap-3">
          <div class="sidebar-logo">PP</div>
          <div class="sidebar-text">
            <h5 class="mb-0">PricePulse</h5>
            <small class="text-muted">Dashboard</small>
          </div>
        </div>
        <div class="list-group list-group-flush">
          <a href="{% url 'dashboard:dashboard_home' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">Dashboard</a>
          <a href="{% url 'dashboard:products' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'products' %}active{% endif %}">Products</a>
          <a href="{% url 'dashboard:price_alerts' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'price_alerts' %}active{% endif %}">Price Alerts</a>
          <a href="{% url 'dashboard:wishlist' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'wishlist' %}active{% endif %}">Wishlist</a>
          <a href="{% url 'dashboard:analytics' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">Analytics</a>
          <a href="{% url 'dashboard:notifications' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">Notifications</a>
          <a href="{% url 'dashboard:settings' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">Settings</a>
        </div>
        <div class="p-4 border-top mt-auto">
          <a href="{% url 'dashboard:track_new' %}" class="btn btn-primary w-100">Track Product</a>
        </div>
      </nav>

      <div class="flex-fill d-flex flex-column">
        <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 px-4">
          <button class="btn btn-light me-3" id="sidebarToggle"><i class="fas fa-bars"></i></button>
          <form class="d-none d-md-flex flex-fill me-3">
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
              <input type="search" class="form-control" placeholder="Search products, stores..." aria-label="Search" />
            </div>
          </form>
          <div class="d-flex align-items-center gap-2 ms-auto">
            <span class="text-muted d-none d-sm-inline">07 Jul 2026</span>
            <a href="{% url 'dashboard:notifications' %}" class="btn btn-light position-relative">
              <i class="fas fa-bell"></i>
              <span class="badge bg-danger rounded-circle position-absolute top-0 start-100 translate-middle">{{ notifications_count|default:0 }}</span>
            </a>
            <a href="{% url 'dashboard:add_product' %}" class="btn btn-outline-primary">Add</a>
            <a href="{% url 'dashboard:track_new' %}" class="btn btn-primary">Track</a>
            <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center">P</div>
          </div>
        </header>

        <main class="flex-fill overflow-auto p-4">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-c6APXN6O5G7U3SAdH35Jm6lEW4pJ9hJWBhOJG9xxqIxXNcdsEOC0nGn9eNkX09Lu" crossorigin="anonymous"></script>
    <script>
      document.getElementById('sidebarToggle')?.addEventListener('click', () => {
        document.querySelector('.sidebar')?.classList.toggle('collapsed');
      });
    </script>
  </body>
</html>
